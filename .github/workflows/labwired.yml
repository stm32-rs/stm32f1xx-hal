name: labwired firmware test

on:
  push:
    branches: [labwired-ci]
  pull_request:

jobs:
  simulate:
    name: LabWired examples (stm32f103)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Add Cortex-M3 target
        run: rustup target add thumbv7m-none-eabi

      - name: Build examples (stm32f103)
        run: |
          cargo build --release --features=stm32f103 --target thumbv7m-none-eabi \
            --example blinky --example serial

      - name: Simulate blinky (GPIO + SysTick)
        uses: labwired/firmware-test@v1
        with:
          script: tests/blinky.yaml

      - name: Simulate serial (USART3 loopback)
        uses: labwired/firmware-test@v1
        with:
          script: tests/serial.yaml
